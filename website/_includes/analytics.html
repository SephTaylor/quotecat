{% if site.posthogKey != "" %}
<!-- PostHog analytics — pageview-only, DNT-respecting, no profiles for anonymous visitors -->
<script>
  !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug getPageViewId captureTraceFeedback captureTraceMetric".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
  posthog.init('{{ site.posthogKey }}', {
    api_host: '/ingest',                 // Reverse-proxied through quotecat.ai (see netlify.toml) so ad blockers can't drop events
    ui_host: '{{ site.posthogHost }}',   // Toolbar/dashboard deep-links still point at PostHog directly
    capture_pageview: true,
    capture_pageleave: true,
    autocapture: false,                  // Pageviews + manual events only — no auto button-tracking noise
    disable_session_recording: true,     // Privacy-friendly default
    respect_dnt: true,                   // Don't track DNT-respecting visitors
    person_profiles: 'identified_only',  // Don't create a profile for every anonymous visitor (saves quota)
    persistence: 'memory',               // No cookies → no consent banner required in most jurisdictions
  });

  // Event delegation: any element with [data-resource] fires
  // resource_clicked with the resource name. Add data-resource="foo" to
  // any CTA you want to attribute (calculators, pricing guide, startup
  // kit, future comparison pages). Single listener on document — no need
  // to touch each link individually.
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest && e.target.closest('[data-resource]');
    if (!el) return;
    try {
      posthog.capture('resource_clicked', {
        name: el.getAttribute('data-resource'),
        href: el.getAttribute('href') || null,
        page: window.location.pathname,
      });
    } catch (err) {
      // Never break navigation on analytics failure
      console && console.warn && console.warn('resource_clicked capture failed', err);
    }
  });

  // App Store / Play Store click tracking. Auto-detects by URL so we don't
  // have to tag every store link individually (there are already several
  // across index.html, payment-success.html, callback.html, etc., and we
  // want future ones caught for free). Fires app_store_click with store =
  // "apple" | "google". Marketing-side "conversion" event: this is the
  // strongest signal a visitor turned into a potential user.
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest && e.target.closest('a[href]');
    if (!el) return;
    var href = el.getAttribute('href') || '';
    var store = null;
    if (href.indexOf('apps.apple.com') !== -1) store = 'apple';
    else if (href.indexOf('play.google.com') !== -1) store = 'google';
    if (!store) return;
    try {
      posthog.capture('app_store_click', {
        store: store,
        href: href,
        page: window.location.pathname,
      });
    } catch (err) {
      console && console.warn && console.warn('app_store_click capture failed', err);
    }
  });

  // Generic CTA click tracking. Any element with [data-cta="name"] fires
  // cta_clicked. Complements data-resource (for resource links) — data-cta
  // is for anything else: "Sign up", "Watch demo", pricing selectors, etc.
  // Untagged elements are ignored; explicit opt-in per CTA.
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest && e.target.closest('[data-cta]');
    if (!el) return;
    try {
      posthog.capture('cta_clicked', {
        name: el.getAttribute('data-cta'),
        href: el.getAttribute('href') || null,
        page: window.location.pathname,
      });
    } catch (err) {
      console && console.warn && console.warn('cta_clicked capture failed', err);
    }
  });

  // Calculator engagement: any page whose <body> carries data-calculator="{name}"
  // fires calculator_engaged the first time the visitor meaningfully touches an
  // input on the page. Distinguishes "used it" from "landed and bounced" in
  // pageview data. Single listener; the `fired` guard prevents repeats within
  // the pageview.
  //
  // Wrapped in DOMContentLoaded because this script runs from <head>, before
  // document.body has been parsed. The first attempt at instrumentation was
  // silently no-op'ing because document.body was null at head-execution time,
  // so getAttribute returned null and the early-return killed the listeners.
  function initCalculatorEngagement() {
    var calcName = document.body && document.body.getAttribute('data-calculator');
    if (!calcName) return;
    var fired = false;
    function fire() {
      if (fired) return;
      fired = true;
      try {
        posthog.capture('calculator_engaged', {
          calculator: calcName,
          page: window.location.pathname,
        });
      } catch (err) {
        console && console.warn && console.warn('calculator_engaged capture failed', err);
      }
    }
    document.addEventListener('input', fire, { passive: true });
    document.addEventListener('change', fire, { passive: true });
    // Preset-value buttons on calculators (25%, 50%, etc.) are button clicks,
    // not input events. Catch them too — but only if the click is inside an
    // interactive control, not any random click on the page.
    document.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('button, [role="button"], .preset-btn, [data-markup], [data-preset]')) {
        fire();
      }
    }, { passive: true });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCalculatorEngagement);
  } else {
    initCalculatorEngagement();
  }
</script>
{% endif %}
